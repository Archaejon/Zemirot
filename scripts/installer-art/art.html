<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Installer artwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Frank+Ruhl+Libre:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { margin: 0; background: #fff; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script>
      const CREAM = "#f6f1e7";
      const INK = "#241c16";
      const GOLD = "#a67c33";
      const GOLD_LIGHT = "#d8b06a";
      const MUTED_DARK = "rgba(243, 235, 223, 0.55)";
      const FAINT_DARK = "rgba(243, 235, 223, 0.3)";

      const serif = (weight, size) =>
        `${weight} ${size}px Newsreader, "Iowan Old Style", Georgia, serif`;
      const ui = (weight, size) => `${weight} ${size}px Inter, "Segoe UI", sans-serif`;
      const hebrew = (weight, size) =>
        `${weight} ${size}px "Frank Ruhl Libre", "Times New Roman", serif`;

      function canvas(width, height) {
        const el = document.createElement("canvas");
        el.width = width;
        el.height = height;
        document.body.appendChild(el);
        const ctx = el.getContext("2d");
        ctx.textBaseline = "alphabetic";
        return { canvas: el, ctx };
      }

      function tracked(ctx, text, x, y, spacing) {
        let cursor = x;
        for (const char of text) {
          ctx.fillText(char, cursor, y);
          cursor += ctx.measureText(char).width + spacing;
        }
        return cursor - spacing;
      }

      /* 164×314 column shown beside the Welcome and Finish pages. */
      function drawSidebar(uninstall) {
        const w = 164;
        const h = 314;
        const { canvas: el, ctx } = canvas(w, h);

        const base = ctx.createLinearGradient(0, 0, 0, h);
        base.addColorStop(0, "#1f1813");
        base.addColorStop(0.55, "#191310");
        base.addColorStop(1, "#120e0b");
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(w / 2, 44, 0, w / 2, 44, 130);
        glow.addColorStop(0, "rgba(224, 138, 94, 0.18)");
        glow.addColorStop(1, "rgba(224, 138, 94, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, 190);

        // A hairline rule pins the panel to the window edge.
        ctx.fillStyle = "rgba(216, 176, 106, 0.22)";
        ctx.fillRect(0, 0, w, 1);

        // Hebrew wordmark replaces a generic eyebrow line.
        if (uninstall) {
          ctx.fillStyle = "rgba(216, 176, 106, 0.72)";
          ctx.font = ui(600, 6.5);
          tracked(ctx, "UNINSTALL", 20, 32, 1.8);
        } else {
          ctx.fillStyle = "rgba(216, 176, 106, 0.8)";
          ctx.font = hebrew(400, 14);
          ctx.fillText("זמירות", 17, 34);
        }

        ctx.fillStyle = CREAM;
        ctx.font = serif(300, 31);
        ctx.fillText("Zemirot", 19, 116);

        ctx.fillStyle = "rgba(216, 176, 106, 0.55)";
        ctx.fillRect(20, 130, 34, 1);
        ctx.save();
        ctx.translate(61, 130.5);
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-1.6, -1.6, 3.2, 3.2);
        ctx.restore();

        ctx.fillStyle = GOLD_LIGHT;
        ctx.font = ui(500, 8);
        tracked(ctx, "STUDIO", 20, 149, 4);

        // Three arches over a baseline: a quiet piyyut motif, not a logo.
        ctx.save();
        ctx.lineWidth = 1;
        const cx = w / 2;
        const baseY = 246;
        for (const radius of [26, 40, 54]) {
          ctx.strokeStyle = `rgba(216, 176, 106, ${0.2 - radius / 500})`;
          ctx.beginPath();
          ctx.arc(cx, baseY, radius, Math.PI, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(216, 176, 106, 0.22)";
        ctx.fillRect(cx - 62, baseY, 124, 1);
        ctx.restore();

        ctx.fillStyle = MUTED_DARK;
        ctx.font = ui(400, 8);
        const lines = uninstall
          ? ["Settings and your own songs", "stay where they are."]
          : ["Hebrew song, five transliterations,", "recordings and sources."];
        lines.forEach((line, index) => ctx.fillText(line, 20, 272 + index * 13));

        ctx.fillStyle = FAINT_DARK;
        ctx.font = ui(500, 6.5);
        tracked(ctx, `VERSION ${window.ART_VERSION}`, 20, 303, 1.15);

        return el.toDataURL("image/png");
      }

      /* 150×57 banner on the header of the directory and progress pages. */
      function drawHeader() {
        const w = 150;
        const h = 57;
        const { canvas: el, ctx } = canvas(w, h);

        ctx.fillStyle = CREAM;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "rgba(166, 124, 51, 0.9)";
        ctx.fillRect(0, 0, 3, h);

        ctx.fillStyle = "rgba(166, 124, 51, 0.85)";
        ctx.font = hebrew(400, 9);
        ctx.fillText("זמירות", 16, 18);

        ctx.fillStyle = INK;
        ctx.font = serif(500, 17);
        ctx.fillText("Zemirot", 15, 37);

        ctx.fillStyle = GOLD;
        ctx.font = ui(600, 7.2);
        tracked(ctx, "STUDIO", 16, 48, 2.7);

        ctx.fillStyle = "rgba(166, 124, 51, 0.22)";
        ctx.fillRect(0, h - 1, w, 1);

        return el.toDataURL("image/png");
      }

      /* Convert PNG data URLs into 24-bit BMPs, the only format NSIS accepts. */
      function toBmp(dataUrl, width, height) {
        const image = new Image();
        image.src = dataUrl;
        return image.decode().then(() => {
          const { canvas: el, ctx } = canvas(width, height);
          ctx.drawImage(image, 0, 0);
          const pixels = ctx.getImageData(0, 0, width, height).data;
          const rowSize = Math.floor((24 * width + 31) / 32) * 4;
          const pixelSize = rowSize * height;
          const buffer = new ArrayBuffer(54 + pixelSize);
          const view = new DataView(buffer);
          const bytes = new Uint8Array(buffer);

          view.setUint8(0, 0x42); // "B"
          view.setUint8(1, 0x4d); // "M"
          view.setUint32(2, 54 + pixelSize, true);
          view.setUint32(10, 54, true);
          view.setUint32(14, 40, true);
          view.setInt32(18, width, true);
          view.setInt32(22, height, true);
          view.setUint16(26, 1, true);
          view.setUint16(28, 24, true);
          view.setUint32(30, 0, true);
          view.setUint32(34, pixelSize, true);
          view.setInt32(38, 2835, true);
          view.setInt32(42, 2835, true);

          for (let y = 0; y < height; y += 1) {
            const sourceRow = height - 1 - y;
            const offset = 54 + y * rowSize;
            for (let x = 0; x < width; x += 1) {
              const source = (sourceRow * width + x) * 4;
              bytes[offset + x * 3] = pixels[source + 2];
              bytes[offset + x * 3 + 1] = pixels[source + 1];
              bytes[offset + x * 3 + 2] = pixels[source];
            }
          }

          return Buffer.from(buffer).toString("base64");
        });
      }

      async function waitForFonts() {
        if (!document.fonts) return;
        const wanted = [
          serif(300, 31),
          serif(500, 17),
          hebrew(400, 14),
          hebrew(400, 9),
          ui(400, 7.6),
          ui(500, 8),
          ui(600, 6.5),
          ui(600, 7.6),
        ];
        const timer = new Promise((resolve) => setTimeout(resolve, 4000));
        await Promise.race([
          Promise.all(wanted.map((font) => document.fonts.load(font, "Zemirot Studio זמירות"))) ,
          timer,
        ]).catch(() => {});
        await Promise.race([document.fonts.ready, timer]).catch(() => {});
      }

      window.ART_VERSION = new URLSearchParams(location.search).get("version") || "1.0.0";

      window.renderArt = async () => {
        await waitForFonts();
        const [installerSidebar, uninstallerSidebar, installerHeader] = await Promise.all([
          toBmp(drawSidebar(false), 164, 314),
          toBmp(drawSidebar(true), 164, 314),
          toBmp(drawHeader(), 150, 57),
        ]);
        return {
          "installerSidebar.bmp": installerSidebar,
          "uninstallerSidebar.bmp": uninstallerSidebar,
          "installerHeader.bmp": installerHeader,
        };
      };
    </script>
  </body>
</html>
