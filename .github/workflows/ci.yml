name: CI

# Typecheck, test, and build on every push and pull request. The Windows
# installer has its own workflow, which runs on version tags.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The Electron binary is only needed to run or package the desktop app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # desktop/update-library.cjs is generated by the build but committed, so
      # the packaged app ships it; fail if someone changed the parser without
      # regenerating it.
      - name: Check the generated updater is committed
        run: git diff --exit-code -- desktop/update-library.cjs
